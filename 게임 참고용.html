<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0d18">
  <title>더케이 오락실 레트로 벽돌깨기</title>
  <style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root {
  --bg-primary: #0a0d18;
  --bg-arcade: #141b2d;
  --bg-panel: #1b243b;
  --bg-card: #222d4a;
  
  --thek-blue: #1e88e5;
  --thek-dark-blue: #0d47a1;
  --thek-sky: #00e5ff;
  --thek-gold: #ffd700;
  --thek-green: #00e676;
  --thek-red: #ff1744;
  --thek-purple: #d500f9;
  
  --text-main: #ffffff;
  --text-muted: #8e9bb4;
  --pixel-border: #3b4d75;
  
  --font-pixel: 'Press Start 2P', 'VT323', monospace;
  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-primary);
  font-family: var(--font-sans);
  color: var(--text-main);
  display: flex;
  justify-content: center;
  align-items: center;
}

.mobile-app-wrapper {
  width: 100%;
  max-width: 440px;
  height: 100%;
  max-height: 940px;
  background: var(--bg-arcade);
  position: relative;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 40px rgba(0, 229, 255, 0.15), 0 0 80px rgba(0, 0, 0, 0.8);
  border: 3px solid var(--pixel-border);
  overflow: hidden;
}

.scanline-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    rgba(18, 16, 16, 0) 50%, 
    rgba(0, 0, 0, 0.25) 50%
  );
  background-size: 100% 4px;
  pointer-events: none;
  z-index: 90;
  opacity: 0.6;
}

.arcade-header {
  padding: 8px 12px;
  background: linear-gradient(180deg, #1f2a45 0%, #141b2d 100%);
  border-bottom: 2px solid var(--pixel-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}

.brand-badge {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-titles {
  display: flex;
  flex-direction: column;
}

.brand-title {
  font-family: var(--font-pixel);
  font-size: 14px;
  font-weight: 800;
  color: var(--thek-sky);
  letter-spacing: 0.5px;
  /* 픽셀 글꼴의 넓은 띄어쓰기 폭 축소 */
  word-spacing: -0.45em;
  text-shadow: 0 0 6px rgba(0, 229, 255, 0.6);
}

.brand-sub {
  font-size: 10px;
  font-weight: 700;
  color: var(--thek-gold);
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.game-switch-tab {
  display: flex;
  background: #0f1524;
  border-radius: 4px;
  padding: 2px;
  gap: 2px;
  border: 1px solid var(--pixel-border);
}

.game-switch-link {
  padding: 3px 6px;
  font-size: 9px;
  font-weight: 700;
  color: var(--text-muted);
  text-decoration: none;
  border-radius: 3px;
  transition: all 0.15s;
}

.game-switch-link.active {
  background: var(--thek-dark-blue);
  color: var(--thek-sky);
  border: 1px solid var(--thek-sky);
}

.btn-header {
  background: var(--bg-panel);
  border: 2px solid var(--pixel-border);
  color: var(--text-main);
  padding: 6px 8px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all 0.1s;
  box-shadow: 2px 2px 0 #000;
}

.btn-header.btn-close-game {
  min-width: 32px;
  justify-content: center;
  font-weight: 800;
  color: #ff8a80;
  border-color: #6b2a3a;
}

.btn-header:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 #000;
}

.game-viewport {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 6px 10px 4px 10px;
  gap: 6px;
  overflow: hidden;
  position: relative;
}

.hud-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-panel);
  border: 2px solid var(--pixel-border);
  padding: 6px 10px;
  border-radius: 6px;
}

.hud-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.hud-label {
  font-family: var(--font-pixel);
  font-size: 8px;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.hud-value {
  font-family: var(--font-pixel);
  font-size: 14px;
  color: var(--thek-gold);
  text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
}

.item-notification-toast {
  position: absolute;
  top: 120px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(14, 21, 38, 0.95);
  border: 2px solid var(--thek-gold);
  border-radius: 8px;
  padding: 10px 14px;
  width: 86%;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.3);
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.item-notification-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.modal-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(5, 8, 16, 0.88);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease-out;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  width: 100%;
  max-height: 90%;
  background: var(--bg-panel);
  border: 3px solid var(--pixel-border);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 229, 255, 0.2);
}

.modal-header {
  padding: 12px 16px;
  background: linear-gradient(180deg, #24304f 0%, #1b243b 100%);
  border-bottom: 2px solid var(--pixel-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-family: var(--font-pixel);
  font-size: 12px;
  color: var(--thek-gold);
}

/* 한글 제목: 픽셀 글꼴의 넓은 띄어쓰기 폭 축소 */
.modal-title.title-tight {
  word-spacing: -0.45em;
}

.btn-close-modal {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
}

.modal-body {
  padding: 14px 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.modal-footer {
  padding: 10px 16px;
  background: var(--bg-arcade);
  border-top: 2px solid var(--pixel-border);
  display: flex;
  gap: 8px;
}

.btn-primary {
  flex: 1;
  padding: 10px;
  background: linear-gradient(135deg, var(--thek-blue), var(--thek-sky));
  border: none;
  border-radius: 6px;
  color: #000;
  font-family: var(--font-pixel);
  font-size: 10px;
  font-weight: bold;
  cursor: pointer;
}

.btn-secondary {
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--pixel-border);
  border-radius: 6px;
  color: #fff;
  font-size: 11px;
  cursor: pointer;
}

.start-screen-content, .gameover-content {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.duckhey-pixel-art {
  font-size: 44px;
  filter: drop-shadow(0 0 10px var(--thek-gold));
  animation: bounce-mascot 1s infinite alternate ease-in-out;
}

.game-main-title {
  font-family: var(--font-pixel);
  font-size: 16px;
  color: var(--thek-sky);
  line-height: 1.4;
  text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
}

.game-sub-badge {
  display: inline-block;
  background: var(--thek-dark-blue);
  color: var(--thek-gold);
  border: 1px solid var(--thek-gold);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
}

.game-intro-text {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.5;
  max-width: 280px;
}

.gameover-score-badge {
  background: #0f1524;
  border: 2px solid var(--thek-gold);
  padding: 10px 20px;
  border-radius: 8px;
  width: 100%;
}

.score-num {
  font-family: var(--font-pixel);
  font-size: 22px;
  color: var(--thek-gold);
  margin-top: 4px;
}

.welfare-report-card {
  background: #172138;
  border-radius: 6px;
  padding: 10px;
  text-align: left;
  width: 100%;
  font-size: 11px;
  line-height: 1.4;
  color: #cfd8dc;
}

.welfare-report-card b {
  color: var(--thek-sky);
}

@keyframes pulse-dot {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

@keyframes bounce-mascot {
  0% { transform: translateY(0); }
  100% { transform: translateY(-8px); }
}

    /* 벽돌깨기 전용 보완 스타일 */
    .breaker-board-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      position: relative;
    }

    .breaker-canvas-wrapper {
      width: 100%;
      height: 100%;
      background: #080c16;
      border: 3px solid var(--pixel-border);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 229, 255, 0.15);
    }

    #breaker-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* 모드 전환 탭 바 */
    .game-switch-tab {
      display: flex;
      background: #0f1524;
      border-radius: 4px;
      padding: 2px;
      gap: 2px;
      border: 1px solid var(--pixel-border);
    }

    .game-switch-link {
      padding: 3px 8px;
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 3px;
      transition: all 0.15s;
    }

    .game-switch-link.active {
      background: var(--thek-dark-blue);
      color: var(--thek-sky);
      border: 1px solid var(--thek-sky);
    }

    /* 하단 생명력(HP) 바 */
    .hp-footer {
      background: linear-gradient(180deg, #141b2d 0%, #0d1220 100%);
      border-top: 2px solid var(--pixel-border);
      padding: 8px 12px 14px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .hp-box {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hp-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-pixel);
      font-size: 8px;
      color: var(--text-muted);
    }

    .hp-label-row b {
      color: #fff;
      font-weight: normal;
    }

    .hp-track {
      position: relative;
      height: 18px;
      background: #0a0f1d;
      border: 2px solid #4a5c88;
      border-radius: 4px;
      overflow: hidden;
    }

    .hp-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      background: linear-gradient(180deg, #69f0ae 0%, #00c853 100%);
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.6);
      transition: width 0.25s ease-out, background 0.25s;
    }

    .hp-fill.mid {
      background: linear-gradient(180deg, #ffe57f 0%, #ffab00 100%);
      box-shadow: 0 0 10px rgba(255, 171, 0, 0.6);
    }

    .hp-fill.low {
      background: linear-gradient(180deg, #ff8a80 0%, #ff1744 100%);
      box-shadow: 0 0 10px rgba(255, 23, 68, 0.7);
      animation: hp-blink 0.6s infinite alternate;
    }

    /* 도트 느낌의 칸 구분선 */
    .hp-track::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0 9%, rgba(10, 15, 29, 0.9) 9% 10%);
      pointer-events: none;
    }

    /* 줄어든 만큼 잠시 남았다가 사라지는 잔상 바 */
    .hp-ghost {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      background: #fff;
      transition: width 0.5s ease-in 0.45s;
    }

    .hp-ghost.hit-now { background: #ff5252; }

    .hp-track.hit {
      animation: hp-shake 0.45s;
      border-color: var(--thek-red);
      box-shadow: 0 0 16px rgba(255, 23, 68, 0.9);
    }

    .hp-footer.damaged { animation: footer-flash 0.5s; }

    /* HP 바 위로 떠오르는 -N / +N */
    .hp-pop {
      position: absolute;
      left: 48px;
      top: -8px;
      font-family: var(--font-pixel);
      font-size: 16px;
      pointer-events: none;
      opacity: 0;
      text-shadow: 0 0 8px currentColor, 2px 2px 0 #000;
    }

    .hp-pop.damage { color: #ff1744; animation: hp-pop-up 0.9s ease-out; }
    .hp-pop.heal { color: #69f0ae; animation: hp-pop-up 0.9s ease-out; }
    .hp-track.heal { border-color: var(--thek-green); box-shadow: 0 0 12px rgba(0, 230, 118, 0.7); }

    .btn-coupon-wallet {
      min-width: 88px;
      height: 38px;
      padding: 0 8px;
      background: linear-gradient(135deg, #ffd700, #ff9100);
      border: 2px solid #ffe600;
      border-radius: 8px;
      color: #111;
      font-weight: 800;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.25;
      box-shadow: 0 3px 0 #9c5500, 0 0 10px rgba(255, 215, 0, 0.35);
      cursor: pointer;
    }

    .btn-coupon-wallet:active { transform: translateY(2px); box-shadow: 0 1px 0 #9c5500; }
    .btn-coupon-wallet .coupon-count { font-family: var(--font-pixel); font-size: 10px; }
    .btn-coupon-wallet.ready { animation: pulse-dot 1s infinite ease-in-out; }

    /* 아이템 카드 (토스트·도감 공용, 쿠폰 모양) */
    .coupon-card {
      display: flex;
      background: #fffdf5;
      color: #1b243b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
    }

    .coupon-stub {
      width: 56px;
      background: linear-gradient(180deg, var(--thek-blue), var(--thek-dark-blue));
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-right: 3px dashed #fffdf5;
      font-size: 24px;
    }

    .coupon-stub small {
      font-family: var(--font-pixel);
      font-size: 6px;
      color: var(--thek-gold);
    }

    .coupon-body {
      flex: 1;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .coupon-tag {
      align-self: flex-start;
      font-size: 9px;
      font-weight: 800;
      color: #fff;
      background: var(--thek-red);
      padding: 1px 6px;
      border-radius: 3px;
    }

    .coupon-title { font-size: 13px; font-weight: 800; }
    .coupon-desc { font-size: 11px; color: #455a64; line-height: 1.35; }

    /* 도감: 획득 카드는 금빛 테두리, 미획득 카드는 흑백·반투명 */
    .coupon-card.owned {
      box-shadow: 0 0 0 2px var(--thek-gold), 0 0 12px rgba(255, 215, 0, 0.45);
    }

    .coupon-card.locked {
      background: #1e2740;
      color: #6b7896;
      box-shadow: none;
      outline: 1px dashed #3b4d75;
    }

    .coupon-card.locked .coupon-stub {
      background: #151c30;
      border-right-color: #1e2740;
      filter: grayscale(1);
      opacity: 0.45;
    }

    .coupon-card.locked .coupon-tag { background: #3b4d75; color: #aab4cc; }
    .coupon-card.locked .coupon-desc { color: #55617d; }

    /* 도감 팝업: 상단(배너·요약)은 고정, 목록만 스크롤 */
    .modal-body.dex-body {
      overflow: hidden;
      min-height: 0;
      flex: 1;
      gap: 10px;
    }

    .dex-fixed {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dex-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 2px 2px 4px;
    }

    /* 카드가 눌려 줄어들지 않고 목록이 스크롤되도록 */
    .dex-list > .coupon-card { flex-shrink: 0; }

    .dex-summary {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 2px;
    }

    .dex-summary b { color: var(--thek-gold); }

    .coupon-card.empty {
      background: transparent;
      border: 2px dashed var(--pixel-border);
      box-shadow: none;
      color: var(--text-muted);
      min-height: 52px;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .item-notification-toast.coupon-mode {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      display: block;
    }

    .coupon-progress {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 6px;
    }

    .coupon-progress span {
      width: 22px;
      height: 8px;
      border-radius: 2px;
      background: #2e3d63;
    }

    .coupon-progress span.on {
      background: var(--thek-gold);
      box-shadow: 0 0 6px rgba(255, 215, 0, 0.8);
    }

    .prize-banner {
      width: 100%;
      background: linear-gradient(135deg, #0d47a1, #1e88e5);
      border: 2px solid var(--thek-gold);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
      color: #fff;
    }

    .prize-banner b { color: var(--thek-gold); }

    .btn-primary:disabled {
      background: #2e3d63;
      color: var(--text-muted);
      cursor: not-allowed;
    }

    @keyframes hp-blink {
      from { opacity: 1; }
      to { opacity: 0.55; }
    }

    @keyframes hp-shake {
      0%, 100% { transform: translateX(0); }
      15%, 55% { transform: translateX(-7px); }
      35%, 75% { transform: translateX(7px); }
    }

    @keyframes footer-flash {
      0%, 100% { background: linear-gradient(180deg, #141b2d 0%, #0d1220 100%); }
      30% { background: linear-gradient(180deg, #5a0f1f 0%, #2a0710 100%); }
    }

    @keyframes hp-pop-up {
      0% { opacity: 0; transform: translateY(8px) scale(0.6); }
      20% { opacity: 1; transform: translateY(-6px) scale(1.25); }
      70% { opacity: 1; transform: translateY(-14px) scale(1); }
      100% { opacity: 0; transform: translateY(-22px) scale(1); }
    }

    /* 헤더: 얼굴만 원형으로 잘라 표시 */
    .mascot-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--thek-sky);
      background-color: #2a1446;
      background-size: 270% auto;
      background-position: 21% 63%;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.7), inset 0 0 6px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
    }

    /* 시작 화면: 캐릭터 전체 */
    .mascot-hero {
      width: 210px;
      height: 150px;
      background-size: cover;
      background-position: center 78%;
      border: 2px solid var(--thek-purple);
      border-radius: 12px;
      box-shadow: 0 0 14px rgba(213, 0, 249, 0.6), 0 0 28px rgba(0, 229, 255, 0.25);
      animation: bounce-mascot 1s infinite alternate ease-in-out;
    }

    /* 게임 오버: 도달 스테이지 / 획득 아이템 */
    .result-stats {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .result-stats .gameover-score-badge {
      flex: 1;
      padding: 10px 8px;
    }
  </style>
</head>
<body>
  <!-- 메인 모바일 앱 프레임 -->
  <div class="mobile-app-wrapper">
    <!-- CRT 스캔라인 오버레이 -->
    <div class="scanline-overlay"></div>

    <!-- 1. 아케이드 상단 헤더 -->
    <header class="arcade-header">
      <div class="brand-badge">
        <span class="mascot-img mascot-avatar" role="img" aria-label="덕헤이 캐릭터"></span>
        <div class="brand-titles">
          <span class="brand-title">더케이 오락실</span>
          <span class="brand-sub">레트로 벽돌깨기</span>
        </div>
      </div>
      <div class="header-controls">
        <button id="btn-sound-bgm" class="btn-header" title="BGM 온/오프">
          <span id="bgm-icon">🎵</span>
        </button>
        <button id="btn-close-game" class="btn-header btn-close-game" title="게임 닫기" aria-label="게임 닫기">✕</button>
      </div>
    </header>

    <!-- 2. 게임 뷰포트 영역 -->
    <main class="game-viewport">
      <!-- 상단 HUD 스테이지/남은 벽돌 + 아이템 도감 -->
      <div class="hud-bar">
        <div class="hud-item">
          <span class="hud-label">STAGE</span>
          <span id="hud-stage" class="hud-value">1</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">BRICKS</span>
          <span id="hud-bricks" class="hud-value" style="color: var(--thek-gold);">0</span>
        </div>
        <button id="btn-coupon-wallet" class="btn-coupon-wallet" aria-label="아이템 도감 열기">
          <span>📖 아이템 도감</span>
          <span id="coupon-count" class="coupon-count" hidden>경품 응모 가능</span>
        </button>
      </div>

      <!-- 메인 벽돌깨기 캔버스 영역 -->
      <div class="breaker-board-container">
        <div class="breaker-canvas-wrapper">
          <canvas id="breaker-canvas"></canvas>
        </div>
      </div>
    </main>

    <!-- 3. 하단 생명력(HP) 바 -->
    <footer class="hp-footer">
      <div class="hp-box">
        <div class="hp-label-row">
          <span>❤️ HP</span>
          <b id="hp-text">100 / 100</b>
        </div>
        <div id="hp-track" class="hp-track" role="progressbar" aria-label="생명력" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
          <div id="hp-ghost" class="hp-ghost"></div>
          <div id="hp-fill" class="hp-fill"></div>
        </div>
        <span id="hp-pop" class="hp-pop"></span>
      </div>
    </footer>

    <!-- 4. 도감 등록 알림 (아이템 카드) -->
    <div id="item-toast" class="item-notification-toast coupon-mode"></div>

    <!-- 7. 모달: 게임 오버 / 클리어 & 자산 리포트 -->
    <div id="modal-gameover" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <span id="gameover-title" class="modal-title">GAME OVER</span>
        </div>
        <div class="modal-body gameover-content">
          <div class="result-stats">
            <div class="gameover-score-badge">
              <div style="font-size: 10px; color: var(--text-muted);">도달 스테이지</div>
              <div id="final-stage" class="score-num">1</div>
            </div>
            <div class="gameover-score-badge">
              <div style="font-size: 10px; color: var(--text-muted);">획득 아이템</div>
              <div id="final-coupons" class="score-num">0</div>
            </div>
          </div>

          <div id="gameover-prize" class="prize-banner"></div>
        </div>
        <div class="modal-footer">
          <button id="btn-gameover-wallet" class="btn-secondary">📖 아이템 도감</button>
          <button id="btn-restart" class="btn-primary">🔄 다시 도전하기</button>
        </div>
      </div>
    </div>

    <!-- 8. 모달: 아이템 도감 -->
    <div id="modal-wallet" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <span class="modal-title title-tight">📖 나의 아이템 도감</span>
          <button id="btn-close-wallet" class="btn-close-modal">✕</button>
        </div>
        <div class="modal-body dex-body">
          <!-- 상단 고정: 경품(본인인증) 안내 + 획득 아이템 수 -->
          <div class="dex-fixed">
            <div id="wallet-prize" class="prize-banner"></div>
            <div id="wallet-summary" class="dex-summary"></div>
          </div>
          <!-- 아이템 목록만 스크롤 -->
          <div id="wallet-list" class="dex-list">
            <!-- JS로 아이템 카드 렌더링 -->
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-wallet-resume" class="btn-secondary">▶ 계속하기</button>
          <button id="btn-prize-apply" class="btn-primary">🎁 본인인증 후 경품 받기</button>
        </div>
      </div>
    </div>

    <!-- 9. 모달: 경품 응모 (본인인증 안내) -->

  <!-- 벽돌깨기 단독 통합 스크립트 -->
  <script>
    // ==========================================
    // 1. 8비트 레트로 신시사이저 오디오 엔진
    // ==========================================
    class RetroAudioEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.isBgmPlaying = false;
        this.bgmTimer = null;
        this.currentNoteIndex = 0;
        this.volume = 0.25;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }

      playTone(freq, type = 'square', duration = 0.08, gainVal = 0.1, pitchBend = 0) {
        if (this.isMuted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (pitchBend !== 0) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(10, freq + pitchBend), this.ctx.currentTime + duration);
          }
          gain.gain.setValueAtTime(gainVal * this.volume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      playPaddleHit() { this.init(); this.playTone(320, 'triangle', 0.06, 0.12, 50); }
      playBrickHit() { this.init(); this.playTone(580, 'square', 0.05, 0.09, 100); }
      playCatchItem() {
        this.init();
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'triangle', 0.12, 0.15, 30), i * 50);
        });
      }
      playBadItem() {
        this.init();
        this.playTone(300, 'sawtooth', 0.12, 0.15, -120);
        setTimeout(() => this.playTone(220, 'sawtooth', 0.15, 0.15, -80), 90);
      }
      playLoseLife() {
        this.init();
        [350, 300, 240, 180].forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'sawtooth', 0.15, 0.14, -50), i * 90);
        });
      }
      playVictory() {
        this.init();
        [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'square', 0.2, 0.18), i * 80);
        });
      }

      toggleBgm() {
        if (this.isBgmPlaying) {
          this.stopBgm();
          return false;
        } else {
          this.startBgm();
          return true;
        }
      }

      startBgm() {
        if (this.isBgmPlaying || this.isMuted) return;
        this.init();
        this.isBgmPlaying = true;
        this.currentNoteIndex = 0;

        // 경쾌한 아케이드 칩튠 아르페지오 멜로디
        const notes = [
          523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.00, 698.46,
          659.25, 783.99, 1046.5, 783.99, 587.33, 493.88, 587.33, 659.25
        ];

        const playNext = () => {
          if (!this.isBgmPlaying || this.isMuted) return;
          const f = notes[this.currentNoteIndex];
          this.playTone(f, 'square', 0.12, 0.04);
          this.playTone(f / 2, 'triangle', 0.1, 0.03);
          this.currentNoteIndex = (this.currentNoteIndex + 1) % notes.length;
          this.bgmTimer = setTimeout(playNext, 160);
        };
        playNext();
      }

      stopBgm() {
        this.isBgmPlaying = false;
        if (this.bgmTimer) {
          clearTimeout(this.bgmTimer);
          this.bgmTimer = null;
        }
      }
    }

    const audio = new RetroAudioEngine();

    // ==========================================
    // 2. 교직원공제회 혜택 & 리스크 데이터 정의
    // ==========================================
    // 선물은 도감 등록 + HP 회복만 있는 단일 아이템
    const GIFT_ITEM = { id: 'gift', name: '선물', icon: '🎁', type: 'GIFT' };

    // 폭탄은 HP 감소만 있는 단일 아이템
    const BOMB_ITEM = { id: 'bomb', name: '폭탄', icon: '💣', type: 'BOMB' };

    // 벽돌 파괴 시 떨어지는 선물/폭탄 롤
    class ItemManager {
      rollDropItem() {
        if (Math.random() > DROP_CHANCE) return null;
        // 선물 50%, 폭탄 50%
        return Math.random() < GIFT_RATIO ? { ...GIFT_ITEM, isGood: true } : { ...BOMB_ITEM, isGood: false };
      }
    }

    // 아이템 드롭 제어: 확률 + 화면당 1개 제한 + 쿨다운
    // 스테이지당 선물(아이템) 최소 노출 보장
    const GIFT_RATIO = 0.5;          // 떨어지는 것 중 선물 비율 (나머지는 폭탄) — 선물:폭탄 = 5:5
    // 스테이지당 선물·폭탄 개수 범위 (최소는 보장, 최대를 넘으면 그 종류는 더 안 떨어짐)
    const MIN_GIFTS_PER_STAGE = 2;
    const MAX_GIFTS_PER_STAGE = 3;
    const MIN_BOMBS_PER_STAGE = 2;
    const MAX_BOMBS_PER_STAGE = 3;
    const GUARANTEE_BRICKS_PER_ITEM = 7; // 부족한 선물·폭탄 1개당, 남은 벽돌이 이 수 이하가 되면 강제로 떨어뜨림
    const START_HINT_TEXT = '화면을 클릭하면 게임 시작!';  // 공 발사 전 화면 가운데 안내
    const MAX_STAGE = 3;             // 마지막 스테이지 (3단계를 깨면 ALL CLEAR)
    const DROP_CHANCE = 0.18;        // 벽돌 1개 파괴 시 드롭 확률
    const DROP_COOLDOWN_SEC = 3.0;   // 직전 아이템이 사라진 뒤 다음 드롭까지 대기 시간
    const ITEM_SIZE = 40;            // 떨어지는 선물/폭탄 크기 (기존 24)

    // 생명력(HP) 설정 — 기존 목숨 3개 대신 HP 바 사용
    const HP_MAX = 100;
    const HP_GIFT_HEAL = 30;         // 🎁 선물 획득 시 회복
    const HP_BOMB_DAMAGE = 25;       // 💣 폭탄 획득 시 감소
    const HP_BALL_LOST_DAMAGE = 30;  // 공을 놓쳤을 때 감소 (회복 없이 4번 놓치면 게임 오버)
    const DAMAGE_FLASH_SEC = 0.5;    // HP 감소 시 화면 흔들림·붉은 번쩍임 지속 시간

    // 선물을 받으면 도감에 등록되는 혜택 아이템 목록 (쿠폰 모양 카드로 표시)
    // 종류·이름·설명은 사용자 제공 아이템 리스트(2026-10-07, 10종) 기준
    const COUPON_POOL = [
      { id: 'cp_saving',   icon: '💰', tag: '저축 상품',   title: '장기저축급여',       desc: '급여율 5.0%, 연복리로 목돈 불리기' },
      { id: 'cp_split',    icon: '📆', tag: '저축 상품',   title: '분할급여금',         desc: '모은 만큼 퇴직 후 월급처럼 받기' },
      { id: 'cp_increase', icon: '📈', tag: '저축 상품',   title: '증좌',               desc: '여윳돈 생길 때마다 증좌로 미래 채우기' },
      { id: 'cp_movie',    icon: '🎬', tag: '문화 혜택',   title: '영화표 할인',        desc: '보고 싶은 영화 365일 할인받고 보기' },
      { id: 'cp_travel',   icon: '🧳', tag: '여행 혜택',   title: '숙박 및 교통 할인',  desc: '숙박·교통 할인으로 여행 경비 줄이기' },
      { id: 'cp_golf',     icon: '⛳', tag: '레저 혜택',   title: '골프장 회원가 이용', desc: '골프장 회원가로 취미 생활 즐기기' },
      { id: 'cp_wedding',  icon: '💍', tag: '축하금 제공', title: '결혼축하금',         desc: '새 출발 축하금 받기' },
      { id: 'cp_mind',     icon: '🧘', tag: '건강 지원',   title: 'The-K 마음쉼',       desc: '마음이 복잡할 때 1:1 상담 받기' },
      { id: 'cp_checkup',  icon: '🩺', tag: '건강 지원',   title: '건강검진',           desc: '제휴 검진기관에서 할인받고 건강 챙기기' },
      { id: 'cp_consult',  icon: '⚖️', tag: '생활 지원',   title: '무료 전문 상담',     desc: '법률·노무·세무 상담 무료로 받기' }
    ];

    // 경품 응모 설정
    // 닫기 버튼 설정 — 브라우저가 창 닫기를 막을 때 이동할 주소 (비어 있으면 이전 페이지로)
    const CLOSE_CONFIG = {
      fallbackUrl: ''
    };

    const PRIZE_CONFIG = {
      requiredCoupons: 3,
      prizeName: '경품',            // 예: '커피 쿠폰' — 확정 시 교체
      authUrl: ''                   // 본인인증 페이지 URL — 비어 있으면 '연동 준비 중' 안내 표시
    };

    // 아이템 도감 — 여러 판에 걸쳐 누적 (브라우저 저장소)
    class CouponWallet {
      constructor() {
        this.ids = [];
        try {
          const saved = JSON.parse(localStorage.getItem('KTCU_BREAKER_COUPONS_V1') || '[]');
          if (Array.isArray(saved)) this.ids = saved.filter(id => COUPON_POOL.some(c => c.id === id));
        } catch (e) {}
      }

      save() {
        try { localStorage.setItem('KTCU_BREAKER_COUPONS_V1', JSON.stringify(this.ids)); } catch (e) {}
      }

      get count() { return this.ids.length; }
      get isPrizeReady() { return this.count >= PRIZE_CONFIG.requiredCoupons; }

      // 아직 없는 아이템을 우선 지급, 모두 모았으면 null
      grant() {
        const remaining = COUPON_POOL.filter(c => !this.ids.includes(c.id));
        if (remaining.length === 0) return null;
        const coupon = remaining[Math.floor(Math.random() * remaining.length)];
        this.ids.push(coupon.id);
        this.save();
        return coupon;
      }
    }

    // ==========================================
    // 3. 도트 벽돌깨기 핵심 게임 엔진
    // ==========================================
    class BrickBreakerGame {
      constructor(canvas, itemManager, couponWallet, onStateChange, onNotifyItem) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.itemManager = itemManager;
        this.couponWallet = couponWallet;
        this.onStateChange = onStateChange;
        this.onNotifyItem = onNotifyItem;

        this.width = 360;
        this.height = 500;

        // 게임 상태
        this.stage = 1;
        this.hp = HP_MAX;
        this.lastHpDelta = 0;
        this.damageFlash = 0;
        this.isPlaying = false;
        this.isPaused = false;
        this.isGameOver = false;
        this.isVictory = false;

        // 패들 상태
        this.paddle = {
          x: 140,
          y: 460,
          width: 80,
          baseWidth: 80,
          height: 14,
          speed: 400,
          moveDir: 0
        };

        // 공들 목록 (멀티볼 지원)
        this.balls = [];
        this.ballAttached = true; // 시작 시 패들에 붙어있음

        // 벽돌 목록
        this.bricks = [];

        // 떨어지는 선물 아이템들 (한 번에 최대 1개)
        this.fallingItems = [];
        this.dropCooldown = 0;
        this.isStageClearing = false;

        // 파티클 & 플로팅 텍스트
        this.particles = [];
        this.floatingTexts = [];

        this.lastTime = 0;
        this.animationFrameId = null;

        this.resizeCanvas();
      }

      resizeCanvas() {
        const parent = this.canvas.parentElement;
        if (!parent) return;
        const w = parent.clientWidth;
        const h = parent.clientHeight;
        const dpr = window.devicePixelRatio || 1;

        this.canvas.width = w * dpr;
        this.canvas.height = h * dpr;
        this.ctx.scale(dpr, dpr);

        this.width = w;
        this.height = h;
        this.paddle.y = this.height - 35;
      }

      start() {
        this.stage = 1;
        this.hp = HP_MAX;
        this.lastHpDelta = 0;
        this.damageFlash = 0;
        this.isPlaying = true;
        this.isPaused = false;
        this.isGameOver = false;
        this.isVictory = false;
        this.fallingItems = [];
        this.dropCooldown = 0;
        this.isStageClearing = false;

        this.initStage(this.stage);
        this.resetBallAndPaddle();

        this.lastTime = performance.now();
        if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
        this.loop(this.lastTime);
        this.triggerStateUpdate();
      }

      // 스테이지별 차이는 벽돌 개수뿐: 1단계 4줄(28개)부터 1줄(7개)씩 늘어 3단계 6줄(42개), 모든 벽돌 1번에 깨짐
      initStage(stageNum) {
        this.bricks = [];
        this.stageGiftDrops = 0;
        this.stageBombDrops = 0;
        const rows = 3 + stageNum;
        const cols = 7;
        const brickW = Math.floor((this.width - 24) / cols);
        const brickH = 18;
        const offsetX = Math.floor((this.width - (brickW * cols)) / 2);
        const offsetY = 40;

        const colors = ['#00E5FF', '#2979FF', '#00E676', '#FFD600', '#FF9100', '#FF1744', '#D500F9'];

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            this.bricks.push({
              x: offsetX + c * brickW + 2,
              y: offsetY + r * brickH + 2,
              width: brickW - 4,
              height: brickH - 4,
              hp: 1,
              maxHp: 1,
              color: colors[r % colors.length]
            });
          }
        }
      }

      resetBallAndPaddle() {
        this.paddle.width = this.paddle.baseWidth;
        this.paddle.x = (this.width - this.paddle.width) / 2;
        this.ballAttached = true;

        this.balls = [{
          x: this.paddle.x + this.paddle.width / 2,
          y: this.paddle.y - 7,
          radius: 6,
          vx: 180,
          vy: -260,
          speed: 320
        }];

      }

      launchBall() {
        if (!this.isPlaying || this.isGameOver) return;
        if (this.ballAttached) {
          this.ballAttached = false;
          // 약간의 랜덤 각도로 발사
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.5;
          const speed = 320;
          this.balls[0].vx = Math.cos(angle) * speed;
          this.balls[0].vy = Math.sin(angle) * speed;
          audio.playPaddleHit();
        }
      }

      movePaddleLeft(isDown) {
        this.paddle.moveDir = isDown ? -1 : 0;
      }

      movePaddleRight(isDown) {
        this.paddle.moveDir = isDown ? 1 : 0;
      }

      setPaddleX(targetX) {
        this.paddle.x = Math.max(0, Math.min(this.width - this.paddle.width, targetX - this.paddle.width / 2));
        if (this.ballAttached && this.balls[0]) {
          this.balls[0].x = this.paddle.x + this.paddle.width / 2;
        }
      }

      // 스와이프용 상대 이동 (손가락 이동량만큼 패들 이동)
      movePaddleBy(dx) {
        this.paddle.x = Math.max(0, Math.min(this.width - this.paddle.width, this.paddle.x + dx));
        if (this.ballAttached && this.balls[0]) {
          this.balls[0].x = this.paddle.x + this.paddle.width / 2;
        }
      }

      // --- 업데이트 및 물리 엔진 ---
      update(deltaSec) {
        if (!this.isPlaying || this.isGameOver) return;

        // 1. 패들 이동
        const pSpeed = this.paddle.speed;

        if (this.paddle.moveDir !== 0) {
          this.paddle.x += this.paddle.moveDir * pSpeed * deltaSec;
          this.paddle.x = Math.max(0, Math.min(this.width - this.paddle.width, this.paddle.x));
          if (this.ballAttached && this.balls[0]) {
            this.balls[0].x = this.paddle.x + this.paddle.width / 2;
          }
        }

        // 2. 공 업데이트 & 충돌 판정
        if (!this.ballAttached && !this.isStageClearing) {
          this.updateBalls(deltaSec);
        }

        // 3. 떨어지는 선물/폭탄 업데이트 & 패들 캐치
        if (this.dropCooldown > 0) this.dropCooldown = Math.max(0, this.dropCooldown - deltaSec);
        for (let i = this.fallingItems.length - 1; i >= 0; i--) {
          const item = this.fallingItems[i];
          item.y += item.vy * deltaSec;

          // 패들과 충돌 (아이템 캐치!)
          if (item.y + item.size >= this.paddle.y && item.y <= this.paddle.y + this.paddle.height &&
              item.x + item.size >= this.paddle.x && item.x <= this.paddle.x + this.paddle.width) {
            this.fallingItems.splice(i, 1);
            this.dropCooldown = DROP_COOLDOWN_SEC;
            this.applyItem(item);
            continue;
          }

          if (item.y > this.height) {
            this.fallingItems.splice(i, 1);
            this.dropCooldown = DROP_COOLDOWN_SEC;
          }
        }

        // 4. 파티클·피해 연출 타이머
        this.updateParticles(deltaSec);

        // 스테이지 클리어 확인
        if (this.bricks.length === 0) {
          this.stageClear();
        }
      }

      updateBalls(deltaSec) {
        for (let i = this.balls.length - 1; i >= 0; i--) {
          const ball = this.balls[i];
          ball.x += ball.vx * deltaSec;
          ball.y += ball.vy * deltaSec;

          // 좌우 벽 튕김
          if (ball.x - ball.radius < 0) {
            ball.x = ball.radius;
            ball.vx = Math.abs(ball.vx);
            audio.playPaddleHit();
          } else if (ball.x + ball.radius > this.width) {
            ball.x = this.width - ball.radius;
            ball.vx = -Math.abs(ball.vx);
            audio.playPaddleHit();
          }

          // 상단 벽 튕김
          if (ball.y - ball.radius < 0) {
            ball.y = ball.radius;
            ball.vy = Math.abs(ball.vy);
            audio.playPaddleHit();
          }

          // 패들 튕김 판정
          if (ball.y + ball.radius >= this.paddle.y && ball.y - ball.radius <= this.paddle.y + this.paddle.height &&
              ball.x >= this.paddle.x - ball.radius && ball.x <= this.paddle.x + this.paddle.width + ball.radius && ball.vy > 0) {
            
            // 패들 맞은 위치에 따른 각도 계산 (-60도 ~ +60도)
            const hitPos = (ball.x - (this.paddle.x + this.paddle.width / 2)) / (this.paddle.width / 2);
            const maxAngle = Math.PI * 0.38;
            const angle = hitPos * maxAngle - Math.PI / 2;
            const curSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);

            ball.vx = Math.cos(angle) * curSpeed;
            ball.vy = Math.sin(angle) * curSpeed;
            ball.y = this.paddle.y - ball.radius - 1;

            audio.playPaddleHit();
            this.createPaddleHitParticles(ball.x, ball.y);
          }

          // 바닥 추락 판정
          if (ball.y - ball.radius > this.height) {
            this.balls.splice(i, 1);
          }

          // 벽돌 충돌 검사
          this.checkBrickCollision(ball);
        }

        // 공이 모두 사라졌을 때
        if (this.balls.length === 0) {
          this.loseLife();
        }
      }

      checkBrickCollision(ball) {
        for (let i = this.bricks.length - 1; i >= 0; i--) {
          const br = this.bricks[i];
          if (ball.x + ball.radius >= br.x && ball.x - ball.radius <= br.x + br.width &&
              ball.y + ball.radius >= br.y && ball.y - ball.radius <= br.y + br.height) {
            // 상하좌우 반사 판정
            const overlapLeft = (ball.x + ball.radius) - br.x;
            const overlapRight = (br.x + br.width) - (ball.x - ball.radius);
            const overlapTop = (ball.y + ball.radius) - br.y;
            const overlapBottom = (br.y + br.height) - (ball.y - ball.radius);

            const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
            if (minOverlap === overlapLeft || minOverlap === overlapRight) {
              ball.vx = -ball.vx;
            } else {
              ball.vy = -ball.vy;
            }

            this.damageBrick(i);
            break;
          }
        }
      }

      damageBrick(index) {
        const br = this.bricks[index];
        br.hp--;
        audio.playBrickHit();
        this.createBrickParticles(br.x + br.width / 2, br.y + br.height / 2, br.color);

        if (br.hp <= 0) {
          this.bricks.splice(index, 1);

          // 아이템 드롭 — 화면에 아이템이 없고 쿨다운이 끝났을 때만 확률로 롤
          const noneFalling = this.fallingItems.length === 0;
          const canDrop = noneFalling && this.dropCooldown <= 0;
          // 최소 개수 보장: 남은 벽돌이 부족해지면 쿨다운과 관계없이 모자란 쪽(선물/폭탄)을 떨어뜨림
          const giftsNeeded = Math.max(0, MIN_GIFTS_PER_STAGE - this.stageGiftDrops);
          const bombsNeeded = Math.max(0, MIN_BOMBS_PER_STAGE - this.stageBombDrops);
          const totalNeeded = giftsNeeded + bombsNeeded;
          const mustDrop = totalNeeded > 0 && noneFalling && this.bricks.length > 0 &&
            this.bricks.length <= totalNeeded * GUARANTEE_BRICKS_PER_ITEM;
          let drop = null;
          if (mustDrop) {
            const giveGift = giftsNeeded === bombsNeeded ? Math.random() < GIFT_RATIO : giftsNeeded > bombsNeeded;
            drop = giveGift ? { ...GIFT_ITEM, isGood: true } : { ...BOMB_ITEM, isGood: false };
          } else if (canDrop) {
            drop = this.itemManager.rollDropItem();
          }
          // 최대 개수 제한: 그 종류가 이미 최대만큼 떨어졌으면 이번 드롭은 건너뜀 (선물·폭탄 확률은 그대로)
          if (drop && drop.isGood && this.stageGiftDrops >= MAX_GIFTS_PER_STAGE) drop = null;
          if (drop && !drop.isGood && this.stageBombDrops >= MAX_BOMBS_PER_STAGE) drop = null;
          if (drop) {
            if (drop.isGood) this.stageGiftDrops++;
            else this.stageBombDrops++;
            this.fallingItems.push({
              ...drop,
              x: br.x + br.width / 2 - ITEM_SIZE / 2,
              y: br.y,
              size: ITEM_SIZE,
              vy: 140
            });
          }
        }
        this.triggerStateUpdate();
      }

      applyItem(item) {
        if (item.isGood) audio.playCatchItem();
        else audio.playBadItem();

        // 선물: 도감 아이템 등록 + HP 회복 / 폭탄: HP 감소
        if (!item.isGood) {
          this.takeDamage(HP_BOMB_DAMAGE, '💣', item.x + item.size / 2, this.paddle.y);
          return;
        }
        const coupon = this.couponWallet.grant();
        this.onNotifyItem(item, coupon);
        this.addFloatingText(`🎁 HP +${HP_GIFT_HEAL}`, this.width / 2, this.height * 0.55, '#69F0AE', 24);
        this.changeHp(HP_GIFT_HEAL);
      }

      // HP 증감 (양수 회복, 음수 감소). 0이 되면 게임 오버
      changeHp(delta) {
        this.hp = Math.max(0, Math.min(HP_MAX, this.hp + delta));
        this.lastHpDelta = delta;
        if (this.hp <= 0 && !this.isGameOver) {
          this.gameOver(false);
          return;
        }
        this.triggerStateUpdate();
      }

      // HP 감소 공통 연출: 화면 흔들림 + 붉은 테두리 번쩍임 + 큰 "HP -N" 문구 + 파편
      takeDamage(amount, icon, x, y) {
        this.damageFlash = DAMAGE_FLASH_SEC;
        this.addFloatingText(`${icon} HP -${amount}`, this.width / 2, this.height * 0.55, '#FF1744', 30);
        for (let i = 0; i < 18; i++) {
          this.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 320,
            vy: -Math.random() * 260 - 40,
            life: 0.7,
            maxLife: 0.7,
            color: i % 2 ? '#FF1744' : '#FF9100',
            size: Math.random() * 5 + 3
          });
        }
        this.changeHp(-amount);
      }

      loseLife() {
        audio.playLoseLife();
        this.takeDamage(HP_BALL_LOST_DAMAGE, '💥', this.paddle.x + this.paddle.width / 2, this.height - 10);
        if (!this.isGameOver) this.resetBallAndPaddle();
      }

      stageClear() {
        // 다음 스테이지 준비 중 매 프레임 재호출되어 스테이지가 연속 증가하는 것을 방지
        if (this.isStageClearing) return;
        this.isStageClearing = true;
        this.fallingItems = [];
        this.dropCooldown = 0;
        audio.playVictory();

        // 마지막 스테이지를 깨면 ALL CLEAR 후 결과 화면
        if (this.stage >= MAX_STAGE) {
          this.addFloatingText('🏆 ALL CLEAR!', this.width / 2, this.height / 2, '#FFE600', 26);
          setTimeout(() => this.gameOver(true), 1200);
          return;
        }

        this.stage++;
        this.addFloatingText(`🌟 STAGE ${this.stage} 돌파!`, this.width / 2, this.height / 2, '#FFE600');
        setTimeout(() => {
          this.initStage(this.stage);
          this.resetBallAndPaddle();
          this.isStageClearing = false;
          this.triggerStateUpdate();
        }, 1200);
      }

      gameOver(victory = false) {
        this.isGameOver = true;
        this.isPlaying = false;
        this.isVictory = victory;
        if (!victory) audio.playLoseLife();
        this.triggerStateUpdate();
      }

      triggerStateUpdate() {
        if (this.onStateChange) {
          this.onStateChange({
            stage: this.stage,
            hp: this.hp,
            hpDelta: this.lastHpDelta,
            bricksLeft: this.bricks.length,
            isGameOver: this.isGameOver,
            isVictory: this.isVictory
          });
        }
      }

      loop(time) {
        if (!this.isPlaying || this.isGameOver) return;
        const deltaTime = Math.min(0.05, (time - this.lastTime) / 1000);
        this.lastTime = time;

        if (!this.isPaused) this.update(deltaTime);
        this.render();

        this.animationFrameId = requestAnimationFrame(t => this.loop(t));
      }

      // --- 렌더링 ---
      render() {
        const { ctx } = this;
        ctx.clearRect(0, 0, this.width, this.height);
        const dmg = this.damageFlash > 0 ? this.damageFlash / DAMAGE_FLASH_SEC : 0;
        ctx.save();
        if (dmg > 0) {
          const amp = 7 * dmg;
          ctx.translate((Math.random() - 0.5) * amp * 2, (Math.random() - 0.5) * amp * 2);
        }

        // 1. 그리드 배경
        ctx.fillStyle = '#0a0f1d';
        ctx.fillRect(0, 0, this.width, this.height);

        // 2. 벽돌 렌더링
        for (const br of this.bricks) {
          ctx.fillStyle = br.color;
          ctx.fillRect(br.x, br.y, br.width, br.height);
          // 8비트 베벨 입체 테두리
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.fillRect(br.x, br.y, br.width, 2);
          ctx.fillRect(br.x, br.y, 2, br.height);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
          ctx.fillRect(br.x, br.y + br.height - 2, br.width, 2);
          ctx.fillRect(br.x + br.width - 2, br.y, 2, br.height);
        }

        // 3. 패들 렌더링
        ctx.fillStyle = '#00E5FF';
        ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.width, this.paddle.height);
        ctx.fillStyle = '#80F0FF';
        ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.width, 3);
        ctx.fillStyle = '#008394';
        ctx.fillRect(this.paddle.x, this.paddle.y + this.paddle.height - 3, this.paddle.width, 3);

        // 4. 공 렌더링
        ctx.fillStyle = '#FFE600';
        for (const ball of this.balls) {
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        // 5. 떨어지는 선물 아이템 캡슐 렌더링
        // 좋은 아이템은 초록 원 + 🎁, 나쁜 아이템은 빨간 원 + 💣 (깜빡이는 테두리)
        for (const item of this.fallingItems) {
          const cx = item.x + item.size / 2;
          const cy = item.y + item.size / 2;
          const r = item.size / 2;
          const color = item.isGood ? '#00E676' : '#FF1744';
          const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 120);

          ctx.save();
          ctx.shadowColor = color;
          ctx.shadowBlur = 16;
          ctx.fillStyle = item.isGood ? 'rgba(0, 60, 30, 0.85)' : 'rgba(70, 0, 15, 0.85)';
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = color;
          ctx.globalAlpha = item.isGood ? 1 : pulse;
          ctx.stroke();
          ctx.restore();

          ctx.font = `${Math.round(item.size * 0.62)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(item.isGood ? '🎁' : '💣', cx, cy + 1);
          ctx.textBaseline = 'alphabetic';
        }

        // 6. 파티클 & 플로팅 텍스트
        this.renderParticles(ctx);
        ctx.restore();

        // 7. 피해 시 붉은 비네트
        if (dmg > 0) {
          const g = ctx.createRadialGradient(this.width / 2, this.height / 2, this.height * 0.25, this.width / 2, this.height / 2, this.height * 0.75);
          g.addColorStop(0, 'rgba(255, 23, 68, 0)');
          g.addColorStop(1, `rgba(255, 23, 68, ${0.6 * dmg})`);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, this.width, this.height);
        }
        this.renderFloatingTexts(ctx);

        // 8. 공 발사 전 시작 안내
        if (this.ballAttached && this.isPlaying && !this.isGameOver && !this.isStageClearing && !this.isPaused) {
          // 네온 효과(빛 번짐·깜빡임) 없이 굵은 일반 텍스트로만 강조
          ctx.save();
          ctx.font = 'bold 20px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#FFE600';
          ctx.fillText(START_HINT_TEXT, this.width / 2, this.height / 2);
          ctx.restore();
        }
      }

      createBrickParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
          this.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 160,
            vy: (Math.random() - 0.5) * 160,
            color,
            life: 0.35,
            maxLife: 0.35,
            size: Math.random() * 4 + 2
          });
        }
      }

      createPaddleHitParticles(x, y) {
        for (let i = 0; i < 6; i++) {
          this.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 120,
            vy: -Math.random() * 80 - 20,
            color: '#00E5FF',
            life: 0.25,
            maxLife: 0.25,
            size: 3
          });
        }
      }

      addFloatingText(text, x, y, color = '#FFFFFF', size = 13) {
        this.floatingTexts.push({ text, x, y, color, size, life: 1.2, maxLife: 1.2 });
      }

      updateParticles(deltaSec) {
        if (this.damageFlash > 0) this.damageFlash = Math.max(0, this.damageFlash - deltaSec);
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * deltaSec;
          p.y += p.vy * deltaSec;
          p.life -= deltaSec;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i];
          ft.y -= 25 * deltaSec;
          ft.life -= deltaSec;
          if (ft.life <= 0) this.floatingTexts.splice(i, 1);
        }
      }

      renderParticles(ctx) {
        for (const p of this.particles) {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life / p.maxLife;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        ctx.globalAlpha = 1.0;
      }

      renderFloatingTexts(ctx) {
        ctx.textAlign = 'center';
        for (const ft of this.floatingTexts) {
          ctx.font = `bold ${ft.size}px monospace`;
          ctx.globalAlpha = Math.min(1, ft.life / (ft.maxLife * 0.4));
          ctx.strokeStyle = '#000';
          ctx.lineWidth = ft.size > 20 ? 6 : 3;
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
        }
        ctx.globalAlpha = 1.0;
      }
    }

    // ==========================================
    // 4. UI 렌더링 및 이벤트 초기화
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      try { localStorage.removeItem('KTCU_BREAKER_CUSTOM_DECK_V1'); } catch (e) {}
      const itemManager = new ItemManager();
      const couponWallet = new CouponWallet();
      const canvas = document.getElementById('breaker-canvas');

      const hudStage = document.getElementById('hud-stage');
      const hpTrack = document.getElementById('hp-track');
      const hpFill = document.getElementById('hp-fill');
      const hpGhost = document.getElementById('hp-ghost');
      const hpPop = document.getElementById('hp-pop');
      const hpFooter = document.querySelector('.hp-footer');
      const hpText = document.getElementById('hp-text');
      const couponCountEl = document.getElementById('coupon-count');
      const btnWallet = document.getElementById('btn-coupon-wallet');
      const modalWallet = document.getElementById('modal-wallet');
      const modalPrize = document.getElementById('modal-prize');
      const hudBricks = document.getElementById('hud-bricks');

      const modalGameOver = document.getElementById('modal-gameover');
      const finalStageEl = document.getElementById('final-stage');
      const finalCouponsEl = document.getElementById('final-coupons');

      const itemToast = document.getElementById('item-toast');
      let toastTimeout = null;

      const escapeHtml = (str) => String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

      // state: '' (알림용) | 'owned' (도감 획득) | 'locked' (도감 미획득)
      function couponCardHtml(c, tagPrefix = '', state = '', no = 0) {
        const label = no ? `No.${String(no).padStart(2, '0')}` : 'ITEM';
        const tag = state === 'locked' ? '🔒 미획득' : `${tagPrefix}${escapeHtml(c.tag)}`;
        return `
          <div class="coupon-card ${state}">
            <div class="coupon-stub">${c.icon}<small>${label}</small></div>
            <div class="coupon-body">
              <span class="coupon-tag">${tag}</span>
              <span class="coupon-title">${escapeHtml(c.title)}</span>
              <span class="coupon-desc">${escapeHtml(c.desc)}</span>
            </div>
          </div>`;
      }

      function progressHtml() {
        let dots = '';
        for (let i = 0; i < PRIZE_CONFIG.requiredCoupons; i++) {
          dots += `<span class="${i < couponWallet.count ? 'on' : ''}"></span>`;
        }
        return `<div class="coupon-progress">${dots}</div>`;
      }

      // 도감 버튼: 응모 전에는 "아이템 도감"만, 응모 가능해지면 아래 줄에 "경품 응모 가능" 추가
      function updateCouponUI() {
        couponCountEl.hidden = !couponWallet.isPrizeReady;
        couponCountEl.textContent = '경품 응모 가능';
        btnWallet.classList.toggle('ready', couponWallet.isPrizeReady);
      }

      // isResult: 결과 팝업(GAME OVER·ALL CLEAR)이면 하단 아이템 도감 버튼으로 안내
      function prizeBannerHtml(isResult = false) {
        const need = PRIZE_CONFIG.requiredCoupons;
        const prize = escapeHtml(PRIZE_CONFIG.prizeName);
        if (couponWallet.isPrizeReady) {
          const guide = isResult
            ? `하단의 아이템 도감 버튼을 눌러 본인인증 후 <b>${prize}</b> 응모가 가능해요.`
            : `본인인증 후 <b>${prize}</b> 응모가 가능해요.`;
          return `🎉 아이템 <b>${couponWallet.count}개</b> 수집 완료!<br>${guide}${progressHtml()}`;
        }
        return `아이템 <b>${need}개</b>를 모으면 본인인증 후 <b>${prize}</b> 응모!<br>앞으로 <b>${need - couponWallet.count}개</b> 남았어요.${progressHtml()}`;
      }

      // 아이템 도감 열기 — 게임 중이면 일시정지
      function openWallet() {
        if (game.isPlaying) game.isPaused = true;
        document.getElementById('wallet-prize').innerHTML = prizeBannerHtml();
        // 전체 아이템을 번호 순으로 보여 주고, 획득 여부로 활성/비활성 표시
        const owned = new Set(couponWallet.ids);
        document.getElementById('wallet-summary').innerHTML =
          `<span>전체 아이템 ${COUPON_POOL.length}종</span><span>획득 <b>${owned.size}</b> / ${COUPON_POOL.length}</span>`;
        const list = document.getElementById('wallet-list');
        list.scrollTop = 0;
        list.innerHTML = COUPON_POOL.map((c, i) => couponCardHtml(c, '', owned.has(c.id) ? 'owned' : 'locked', i + 1)).join('');
        document.getElementById('btn-prize-apply').disabled = !couponWallet.isPrizeReady;
        document.getElementById('btn-wallet-resume').textContent = game.isPlaying ? '▶ 계속하기' : '닫기';
        modalWallet.classList.add('active');
      }

      function closeWallet() {
        modalWallet.classList.remove('active');
        game.isPaused = false;
      }

      function openPrize() {
        if (!couponWallet.isPrizeReady) return;
        if (game.isPlaying) game.isPaused = true;
        const prize = escapeHtml(PRIZE_CONFIG.prizeName);
        document.getElementById('prize-count').textContent = couponWallet.count;
        document.getElementById('prize-message').innerHTML = PRIZE_CONFIG.authUrl
          ? `경품 지급을 위해 <b>본인인증</b>이 필요해요.<br>인증을 마치면 <b>${prize}</b> 응모가 완료됩니다.`
          : '본인인증 연동을 준비하고 있어요.<br>조금만 기다려 주세요! 모은 아이템은 도감에 그대로 보관됩니다.';
        const btnAuth = document.getElementById('btn-prize-auth');
        btnAuth.disabled = !PRIZE_CONFIG.authUrl;
        btnAuth.textContent = PRIZE_CONFIG.authUrl ? '🔐 본인인증 하기' : '🔐 준비 중';
        modalWallet.classList.remove('active');
        modalPrize.classList.add('active');
      }

      function closePrize() {
        modalPrize.classList.remove('active');
        game.isPaused = false;
      }

      // 알림 카드를 상단 HUD(STAGE·BRICKS·아이템 도감) 위에 겹쳐 벽돌을 가리지 않게 배치
      const hudBar = document.querySelector('.hud-bar');
      const appWrapper = document.querySelector('.mobile-app-wrapper');
      function placeToastOverHud() {
        const hud = hudBar.getBoundingClientRect();
        const wrap = appWrapper.getBoundingClientRect();
        itemToast.style.top = (hud.top - wrap.top) + 'px';
        itemToast.style.width = hud.width + 'px';
      }

      function showItemToast(item, coupon) {
        // 새 아이템이 도감에 등록됐을 때만 카드 알림 (전 종류를 모은 뒤에는 HP 회복만)
        if (coupon) {
          itemToast.innerHTML = couponCardHtml(coupon, '📖 도감 등록 · ');
          placeToastOverHud();
          updateCouponUI();
          if (couponWallet.count === PRIZE_CONFIG.requiredCoupons) {
            game.addFloatingText(`🎉 아이템 ${PRIZE_CONFIG.requiredCoupons}개 달성! 경품 응모 가능`, game.width / 2, game.height / 2 - 30, '#FFD700');
          }
          itemToast.classList.add('show');
          if (toastTimeout) clearTimeout(toastTimeout);
          toastTimeout = setTimeout(() => itemToast.classList.remove('show'), 2800);
        }
      }

      function handleStateChange(state) {
        hudStage.textContent = state.stage;
        const hpPct = Math.round((state.hp / HP_MAX) * 100);
        hpFill.style.width = hpPct + '%';
        hpGhost.style.width = hpPct + '%';
        hpFill.className = 'hp-fill' + (hpPct <= 30 ? ' low' : hpPct <= 60 ? ' mid' : '');
        hpText.textContent = `${state.hp} / ${HP_MAX}`;
        hpTrack.setAttribute('aria-valuenow', state.hp);
        if (state.hpDelta) {
          const isHit = state.hpDelta < 0;
          [hpTrack, hpFooter, hpPop].forEach(el => el.classList.remove('hit', 'heal', 'damaged', 'damage'));
          void hpTrack.offsetWidth; // 애니메이션 재시작
          hpTrack.classList.add(isHit ? 'hit' : 'heal');
          hpPop.textContent = isHit ? `HP ${state.hpDelta}` : `HP +${state.hpDelta}`;
          hpPop.classList.add(isHit ? 'damage' : 'heal');
          hpGhost.classList.toggle('hit-now', isHit);
          if (isHit) hpFooter.classList.add('damaged');
          setTimeout(() => {
            hpTrack.classList.remove('hit', 'heal');
            hpFooter.classList.remove('damaged');
          }, 500);
          game.lastHpDelta = 0;
        }
        hudBricks.textContent = state.bricksLeft;

        if (state.isGameOver) {
          finalStageEl.textContent = state.stage;
          document.getElementById('gameover-title').textContent = state.isVictory ? 'ALL CLEAR!' : 'GAME OVER';
          // 재시작 버튼: 올클리어는 '한 판 더', 게임 오버는 '다시 도전하기'
          document.getElementById('btn-restart').textContent = state.isVictory ? '🔄 한 판 더' : '🔄 다시 도전하기';
          finalCouponsEl.textContent = couponWallet.count;
          document.getElementById('gameover-prize').innerHTML = prizeBannerHtml(true);
          modalGameOver.classList.add('active');
        }
      }

      const game = new BrickBreakerGame(canvas, itemManager, couponWallet, handleStateChange, showItemToast);

      btnWallet.addEventListener('click', openWallet);
      document.getElementById('btn-gameover-wallet').addEventListener('click', openWallet);
      document.getElementById('btn-close-wallet').addEventListener('click', closeWallet);
      document.getElementById('btn-wallet-resume').addEventListener('click', closeWallet);
      document.getElementById('btn-prize-apply').addEventListener('click', openPrize);
      document.getElementById('btn-close-prize').addEventListener('click', closePrize);
      document.getElementById('btn-prize-cancel').addEventListener('click', closePrize);
      document.getElementById('btn-prize-auth').addEventListener('click', () => {
        if (!PRIZE_CONFIG.authUrl) return;
        // 게임은 개인정보를 받지 않음 — 본인인증은 외부 인증 페이지에서 처리
        window.open(PRIZE_CONFIG.authUrl, '_blank', 'noopener');
      });
      updateCouponUI();

      const restartHandler = (e) => {
        if (e) e.preventDefault();
        audio.init();
        modalGameOver.classList.remove('active');
        game.start();
      };
      const btnRestart = document.getElementById('btn-restart');
      btnRestart.addEventListener('click', restartHandler);
      btnRestart.addEventListener('touchend', restartHandler);

      // 닫기: 창 닫기 시도 → 막히면 이전 페이지 → 그래도 안 되면 fallbackUrl
      document.getElementById('btn-close-game').addEventListener('click', () => {
        audio.stopBgm();
        game.isPaused = true;
        window.close();
        // 스크립트로 연 창이 아니면 브라우저가 window.close()를 무시하므로 잠시 후 대체 동작
        setTimeout(() => {
          if (window.closed) return;
          if (CLOSE_CONFIG.fallbackUrl) {
            location.href = CLOSE_CONFIG.fallbackUrl;
          } else if (history.length > 1) {
            history.back();
          }
        }, 200);
      });

      document.getElementById('btn-sound-bgm').addEventListener('click', () => {
        const isPlaying = audio.toggleBgm();
        document.getElementById('bgm-icon').textContent = isPlaying ? '🎵' : '🔇';
      });

      // --- PC: 최초 클릭 후 마우스 좌우 이동으로 패들 추적 ---
      let mouseControlOn = false;
      canvas.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        audio.init();
        if (!mouseControlOn) {
          // 첫 클릭: 마우스 조작을 켜고 바로 발사까지
          mouseControlOn = true;
          const rect = canvas.getBoundingClientRect();
          game.setPaddleX(e.clientX - rect.left);
        }
        game.launchBall();
      });
      // 커서가 게임 화면 밖으로 나가도 계속 따라오도록 window에서 추적
      window.addEventListener('mousemove', (e) => {
        if (!mouseControlOn || game.isPaused) return;
        const rect = canvas.getBoundingClientRect();
        game.setPaddleX(e.clientX - rect.left);
      });

      // --- 모바일: 스와이프 방향·이동량만큼 패들 이동, 짧은 탭은 발사 ---
      const SWIPE_SENSITIVITY = 1.3;
      const TAP_MAX_MOVE = 8;
      const TAP_MAX_MS = 250;
      let touchLastX = 0;
      let touchStartX = 0;
      let touchStartTime = 0;

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        audio.init();
        const t = e.touches[0];
        touchLastX = touchStartX = t.clientX;
        touchStartTime = performance.now();
      }, { passive: false });
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const x = e.touches[0].clientX;
        game.movePaddleBy((x - touchLastX) * SWIPE_SENSITIVITY);
        touchLastX = x;
      }, { passive: false });
      canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        const t = e.changedTouches[0];
        const isTap = Math.abs(t.clientX - touchStartX) < TAP_MAX_MOVE && performance.now() - touchStartTime < TAP_MAX_MS;
        if (isTap) game.launchBall();
      }, { passive: false });

      // 키보드 컨트롤러
      window.addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
        audio.init();
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') game.movePaddleLeft(true);
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') game.movePaddleRight(true);
        if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') game.launchBall();
        if (e.key === 'm' || e.key === 'M') {
          const isPlaying = audio.toggleBgm();
          document.getElementById('bgm-icon').textContent = isPlaying ? '🎵' : '🔇';
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') game.movePaddleLeft(false);
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') game.movePaddleRight(false);
      });

      window.addEventListener('resize', () => game.resizeCanvas());

      // --- 진입 즉시 게임 시작 (시작 안내 팝업 없음) ---
      // 브라우저 정책상 소리는 사용자가 처음 화면을 누른 뒤부터 들림 (첫 클릭·탭·키 입력 때 audio.init()으로 재생 허용)
      game.start();
      audio.startBgm();
    });
  </script>
</body>
</html>
